<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f7" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crew FX">
<title>Crew FX</title>
<link rel="icon" href="icons/icon.svg?v=7" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=7" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<link rel="manifest" href="manifest.webmanifest?v=7">
<script>
// ---------- Day / night ----------
// Auto: light between sunrise and sunset where she is (from the last GPS fix), dark at night.
// Without a location it uses the phone's clock (07:00–19:00 is day). She can also force Light or Dark.
window.CrewTheme = (() => {
  const MODES = ['auto', 'light', 'dark'];
  const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  let mode = MODES.includes(get('crewfx.theme')) ? get('crewfx.theme') : 'auto';
  let coords = null;
  try { coords = JSON.parse(get('crewfx.coords')); } catch {}

  const rad = Math.PI / 180;
  // Sunrise/sunset (as ms timestamps) for the solar day n, via the standard sunrise equation.
  function sunDay(n, lat, lon) {
    const J = n - lon / 360;
    const M = (357.5291 + 0.98560028 * J) % 360;
    const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    const L = (M + C + 180 + 102.9372) % 360;
    const transit = 2451545 + J + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
    const decl = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
    const cosW = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
    if (cosW > 1) return 'night';   // polar night
    if (cosW < -1) return 'day';    // midnight sun
    const w = Math.acos(cosW) / rad / 360;
    const toMs = (jd) => (jd - 2440587.5) * 86400000;
    return { rise: toMs(transit - w), set: toMs(transit + w) };
  }

  function isDay(now = Date.now()) {
    if (!coords) {
      const h = new Date(now).getHours();
      return h >= 7 && h < 19;
    }
    const n = Math.ceil(now / 86400000 + 2440587.5 - 2451545 + 0.0008);
    // Check neighbouring solar days too, so any longitude and time of day resolves correctly.
    for (const d of [n - 1, n, n + 1]) {
      const t = sunDay(d, coords.lat, coords.lon);
      if (t === 'day') return true;
      if (t === 'night') return false;
      if (now >= t.rise && now < t.set) return true;
    }
    return false;
  }

  function current() {
    return mode === 'auto' ? (isDay() ? 'light' : 'dark') : mode;
  }

  const listeners = [];
  function apply() {
    const theme = current();
    document.documentElement.dataset.theme = theme;
    const meta = document.getElementById('themeColor');
    if (meta) meta.content = theme === 'dark' ? '#000000' : '#f5f5f7';
    listeners.forEach(fn => fn(mode, theme));
  }

  apply();
  setInterval(apply, 60 * 1000);

  return {
    get mode() { return mode; },
    cycle() {
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      set('crewfx.theme', mode);
      apply();
    },
    setCoords(lat, lon) {
      coords = { lat, lon };
      set('crewfx.coords', JSON.stringify(coords));
      apply();
    },
    onChange(fn) { listeners.push(fn); fn(mode, current()); },
    apply,
    isDay,
  };
})();
</script>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #86868b;
    --hairline: #d2d2d7;
    --accent: #c8102e;
    --link: #c8102e;
    --field: #f5f5f7;
    --nav: rgba(245, 245, 247, 0.8);
    --scrim: rgba(0, 0, 0, 0.32);
    --live: #34c759;
    --stale: #ff9f0a;
    --err: #ff3b30;
    --ring: rgba(200, 16, 46, 0.16);
  }
  /* Night palette: set by the day/night script below (falls back to the phone's setting without JS). */
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --ink: #f5f5f7;
    --ink-2: #a1a1a6;
    --ink-3: #8e8e93;
    --hairline: #38383a;
    --accent: #e0263a;
    --link: #ff5f6b;
    --field: #2c2c2e;
    --nav: rgba(22, 22, 23, 0.8);
    --scrim: rgba(0, 0, 0, 0.6);
    --ring: rgba(255, 95, 107, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #8e8e93;
      --hairline: #38383a;
      --accent: #e0263a;
      --link: #ff5f6b;
      --field: #2c2c2e;
      --nav: rgba(22, 22, 23, 0.8);
      --scrim: rgba(0, 0, 0, 0.6);
      --ring: rgba(255, 95, 107, 0.28);
    --ring: rgba(255, 95, 107, 0.28);
    }
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { transition: background-color .4s, color .4s; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  /* No double-tap zoom when tapping keys quickly; pinch-zoom still works. */
  html, button, input { touch-action: manipulation; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    min-height: 100vh;
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  input { font: inherit; letter-spacing: inherit; }

  /* ---------- One-screen layout ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    /* Real visible height measured in JS; some Android installs report 100dvh taller than the screen. */
    height: var(--app-h, 100dvh);
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- Top bar ---------- */
  .top {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .top-actions { display: flex; align-items: center; gap: 14px; }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: 0; padding: 6px 0;
    font-size: 14px; color: var(--link); cursor: pointer;
  }
  .theme-btn svg { width: 16px; height: 16px; }
  .nav-link {
    background: none;
    border: 0;
    padding: 6px 0;
    font-size: 14px;
    color: var(--link);
    cursor: pointer;
  }

  /* ---------- Hero ---------- */
  /* The hero soaks up spare height on tall phones, keeping the amounts low within thumb reach. */
  .hero {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 4px 0 14px;
  }
  .eyebrow { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 0; }
  .hero h1 {
    font-size: clamp(30px, 9vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.005em;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero .sub { font-size: 17px; line-height: 1.25; color: var(--ink); margin: 2px 0 0; }
  .ctas { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 18px;
    border-radius: 980px;
    font-size: 15px;
    cursor: pointer;
    border: 1px solid var(--accent);
    white-space: nowrap;
    transition: background-color .2s, opacity .2s;
  }
  .pill.primary { background: var(--accent); color: #fff; }
  .pill.secondary { background: transparent; color: var(--link); border-color: var(--link); }
  .pill:active { opacity: .7; }
  .pill:disabled { opacity: .5; cursor: default; }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -0.01em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.live { background: var(--live); }
  .dot.stale { background: var(--stale); }
  .dot.err { background: var(--err); }

  /* ---------- Converter ---------- */
  .card { background: var(--surface); border-radius: 18px; overflow: hidden; }
  .local-card { flex: none; padding: 14px 18px 12px; }
  .local-head { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .local-head .flag { font-size: 22px; line-height: 1; }
  .local-head .code { font-weight: 600; }
  .local-head .name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Amount fields: tap the number to type it; tap the calculator icon for + − × ÷. */
  .amount-field { position: relative; margin-top: 8px; }
  .amount-field.small { margin-top: 0; }
  .calc-btn {
    position: absolute; top: 0; bottom: 0; right: 0; width: 52px;
    display: flex; align-items: center; justify-content: center;
    border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--ink-3);
  }
  .calc-btn svg { width: 24px; height: 24px; }
  .amount-field.small .calc-btn { right: auto; left: 0; width: 38px; }
  .amount-field.small .calc-btn svg { width: 20px; height: 20px; }
  .calc-btn:active, .amount-field:focus-within .calc-btn { color: var(--accent); }
  input.big {
    display: block;
    width: 100%;
    height: calc(clamp(34px, 10vw, 46px) * 1.25 + 11px);   /* fixed, so shrinking a long number keeps the box size */
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    background: var(--field);
    padding: 4px 56px 4px 14px;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
    color: var(--ink);
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    outline: none;
    caret-color: var(--accent);
  }
  input.big:focus, input.amt:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .local-card .hint { font-size: 13px; color: var(--ink-3); margin-top: 6px; }

  .section-title {
    flex: none;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 14px 18px 6px;
  }
  /* Rows shrink evenly on short screens so the whole page fits without scrolling. */
  #rows {
    flex: 0 1 auto;
    min-height: 0;
    display: grid;
    grid-auto-rows: minmax(0, 80px);
  }
  .row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 12px;
    padding: 0 14px 0 18px;
    min-height: 0;
    position: relative;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    top: 0; right: 0; left: 62px;
    border-top: 0.5px solid var(--hairline);
  }
  .row .flag { font-size: 26px; line-height: 1; }
  .row .code { font-weight: 600; font-size: 17px; line-height: 1.2; }
  /* Rate may wrap to a second line on narrow phones rather than being cut off. */
  .row .rate { font-size: 12px; line-height: 1.25; color: var(--ink-2); letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  input.amt {
    height: 44px;
    width: 36vw;
    max-width: 210px;
    border: 1.5px solid var(--hairline);
    border-radius: 12px;
    background: var(--field);
    color: var(--ink);
    text-align: right;
    font-size: 21px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 6px 10px 6px 38px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
    caret-color: var(--accent);
  }

  @media (max-width: 380px) { .row .rate { font-size: 11px; } .row { column-gap: 10px; } }

  /* Small phones (iPhone SE / mini): tighten the top half. */
  @media (max-height: 700px) {
    .hero { padding-bottom: 10px; }
    .hero h1 { font-size: 30px; }
    .hero .sub { font-size: 15px; }
    .ctas { margin-top: 8px; }
    .status { margin-top: 6px; }
    input.big { font-size: 34px; height: calc(34px * 1.25 + 11px); }
    .section-title { margin: 10px 18px 4px; }
  }

  /* ---------- Calculator keypad ---------- */
  input.amt-input.editing {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--ring);
  }
  .pad {
    position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
    max-width: 560px; margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.32, .72, 0, 1);
  }
  body.padding .pad { transform: translateY(0); }
  .pad-display { padding: 0 6px 10px; }
  .pad-head { display: flex; align-items: center; justify-content: space-between; }
  .pad-head .nav-link { font-size: 17px; font-weight: 600; }
  .pad-cur { font-weight: 600; font-size: 15px; }
  .pad-expr { min-height: 20px; font-size: 16px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .pad-result { font-size: 38px; line-height: 1.1; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  /* Live conversions of the running total, so nothing is hidden behind the keypad. */
  .pad-conv {
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 8px;
    margin-top: 8px; min-height: 30px;
  }
  .pad-conv span {
    background: var(--field); border-radius: 999px; padding: 4px 10px;
    font-size: 14px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .pad-conv b { color: var(--ink); font-weight: 600; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .k {
    height: 52px; border: 0; border-radius: 14px;
    background: var(--field); color: var(--ink);
    font-size: 24px; font-weight: 500; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .k:active { filter: brightness(.9); }
  .k.fn { color: var(--ink-2); font-size: 20px; }
  .k.op { color: var(--accent); font-size: 28px; }
  .k.eq { grid-row: span 2; height: auto; background: var(--accent); color: #fff; font-size: 28px; }
  .k.zero { grid-column: span 2; }
  @media (max-height: 640px) { .k { height: 44px; } .pad-result { font-size: 30px; } }

  /* ---------- Currency picker sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: var(--scrim);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .sheet {
    position: fixed; z-index: 21;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    max-width: 680px;
    height: min(88vh, 720px);
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.32, .72, 0, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.picking .scrim { opacity: 1; pointer-events: auto; }
  body.picking .sheet { transform: translateY(0); }
  body.picking { overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 8px auto 0; }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 8px;
  }
  .sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .search {
    margin: 0 16px 8px;
    display: flex; align-items: center; gap: 8px;
    background: var(--field);
    border-radius: 12px;
    padding: 0 12px;
    height: 44px;
  }
  :root:not([data-theme="dark"]) .search { background: rgba(118, 118, 128, .12); }
  .search svg { flex: none; color: var(--ink-3); }
  .search input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; outline: none;
    color: var(--ink);
    font-size: 17px;
  }
  .search input::placeholder { color: var(--ink-3); }
  .results { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; flex: 1; }
  .group-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0;
    color: var(--ink-2);
    margin: 16px 4px 6px;
  }
  .opt {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    column-gap: 12px;
    width: 100%;
    padding: 11px 16px;
    background: var(--surface);
    border: 0;
    text-align: left;
    cursor: pointer;
    position: relative;
  }
  .opt:first-of-type { border-radius: 12px 12px 0 0; }
  .opt:last-of-type { border-radius: 0 0 12px 12px; }
  .opt:only-of-type { border-radius: 12px; }
  .opt + .opt::before {
    content: ""; position: absolute; top: 0; right: 0; left: 60px;
    border-top: 0.5px solid var(--hairline);
  }
  .opt:active { background: var(--field); }
  .opt .flag { font-size: 24px; line-height: 1; }
  .opt .t { font-size: 17px; }
  .opt .s { font-size: 13px; color: var(--ink-2); }
  .opt .c { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .opt.selected .c { color: var(--accent); font-weight: 600; }
  .empty { color: var(--ink-2); text-align: center; padding: 32px 16px; font-size: 15px; }
  .group { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/icon.svg?v=7" alt="">Crew FX</div>
    <div class="top-actions">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Day/night mode"></button>
      <button class="nav-link" id="refreshBtn" type="button">Refresh rates</button>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow" id="eyebrow">Local currency</p>
    <h1 id="place">—</h1>
    <p class="sub" id="placeSub">Loading…</p>
    <div class="ctas">
      <button class="pill primary" id="changeBtn" type="button">Change currency</button>
      <button class="pill secondary" id="locateBtn" type="button">Use my location</button>
    </div>
    <div><span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading live rates…</span></span></div>
  </section>

  <div class="card local-card" id="localCard"></div>
  <h2 class="section-title">Converted · tap to edit</h2>
  <div class="card" id="rows"></div>
</div>

<div class="pad" id="pad" role="dialog" aria-label="Calculator">
  <div class="pad-display">
    <div class="pad-head">
      <span class="pad-cur"><span id="padFlag"></span> <span id="padCode"></span></span>
      <button class="nav-link" type="button" data-key="done">Done</button>
    </div>
    <div class="pad-expr" id="padExpr"></div>
    <div class="pad-result" id="padResult"></div>
    <div class="pad-conv" id="padConv"></div>
  </div>
  <div class="keys">
    <button type="button" class="k fn" data-key="clear">C</button>
    <button type="button" class="k fn" data-key="back" aria-label="Delete">⌫</button>
    <button type="button" class="k op" data-key="/">÷</button>
    <button type="button" class="k op" data-key="*">×</button>
    <button type="button" class="k" data-key="7">7</button>
    <button type="button" class="k" data-key="8">8</button>
    <button type="button" class="k" data-key="9">9</button>
    <button type="button" class="k op" data-key="-">−</button>
    <button type="button" class="k" data-key="4">4</button>
    <button type="button" class="k" data-key="5">5</button>
    <button type="button" class="k" data-key="6">6</button>
    <button type="button" class="k op" data-key="+">+</button>
    <button type="button" class="k" data-key="1">1</button>
    <button type="button" class="k" data-key="2">2</button>
    <button type="button" class="k" data-key="3">3</button>
    <button type="button" class="k eq" data-key="=">=</button>
    <button type="button" class="k zero" data-key="0">0</button>
    <button type="button" class="k" data-key=".">.</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Choose currency</h2>
    <button class="nav-link" id="doneBtn" type="button" style="font-size:17px">Done</button>
  </div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Country, currency or code" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  </label>
  <div class="results" id="results"></div>
</div>

<script>
(() => {
  // Her most used currencies, always shown.
  const FAVOURITES = ['AED', 'KRW', 'CAD', 'USD'];
  const REFRESH_MS = 5 * 60 * 1000;
  const DETECT_EVERY_MS = 30 * 60 * 1000;
  const STORE_RATES = 'crewfx.rates';
  const STORE_LOCAL = 'crewfx.local';
  const STORE_AMOUNT = 'crewfx.amount';
  const STORE_COUNTRY = 'crewfx.country';   // last detected country
  const STORE_PLACE = 'crewfx.place';       // country shown in the headline
  const STORE_RECENT = 'crewfx.recent';

  // Common crew destinations suggested in the picker.
  const SUGGESTED = ['THB', 'EUR', 'GBP', 'JPY', 'INR', 'SGD', 'HKD', 'AUD', 'CNY', 'SAR', 'QAR', 'TRY'];

  // ISO country code → currency code.
  const COUNTRY_CURRENCY = Object.fromEntries(`
    AD:EUR AE:AED AF:AFN AG:XCD AI:XCD AL:ALL AM:AMD AO:AOA AR:ARS AS:USD AT:EUR AU:AUD AW:AWG AX:EUR AZ:AZN
    BA:BAM BB:BBD BD:BDT BE:EUR BF:XOF BG:BGN BH:BHD BI:BIF BJ:XOF BL:EUR BM:BMD BN:BND BO:BOB BQ:USD BR:BRL
    BS:BSD BT:BTN BW:BWP BY:BYN BZ:BZD CA:CAD CC:AUD CD:CDF CF:XAF CG:XAF CH:CHF CI:XOF CK:NZD CL:CLP CM:XAF
    CN:CNY CO:COP CR:CRC CU:CUP CV:CVE CW:ANG CX:AUD CY:EUR CZ:CZK DE:EUR DJ:DJF DK:DKK DM:XCD DO:DOP DZ:DZD
    EC:USD EE:EUR EG:EGP EH:MAD ER:ERN ES:EUR ET:ETB FI:EUR FJ:FJD FK:FKP FM:USD FO:DKK FR:EUR GA:XAF GB:GBP
    GD:XCD GE:GEL GF:EUR GG:GBP GH:GHS GI:GIP GL:DKK GM:GMD GN:GNF GP:EUR GQ:XAF GR:EUR GT:GTQ GU:USD GW:XOF
    GY:GYD HK:HKD HN:HNL HR:EUR HT:HTG HU:HUF ID:IDR IE:EUR IL:ILS IM:GBP IN:INR IO:USD IQ:IQD IR:IRR IS:ISK
    IT:EUR JE:GBP JM:JMD JO:JOD JP:JPY KE:KES KG:KGS KH:KHR KI:AUD KM:KMF KN:XCD KP:KPW KR:KRW KW:KWD KY:KYD
    KZ:KZT LA:LAK LB:LBP LC:XCD LI:CHF LK:LKR LR:LRD LS:LSL LT:EUR LU:EUR LV:EUR LY:LYD MA:MAD MC:EUR MD:MDL
    ME:EUR MF:EUR MG:MGA MH:USD MK:MKD ML:XOF MM:MMK MN:MNT MO:MOP MP:USD MQ:EUR MR:MRU MS:XCD MT:EUR MU:MUR
    MV:MVR MW:MWK MX:MXN MY:MYR MZ:MZN NA:NAD NC:XPF NE:XOF NF:AUD NG:NGN NI:NIO NL:EUR NO:NOK NP:NPR NR:AUD
    NU:NZD NZ:NZD OM:OMR PA:PAB PE:PEN PF:XPF PG:PGK PH:PHP PK:PKR PL:PLN PM:EUR PN:NZD PR:USD PS:ILS PT:EUR
    PW:USD PY:PYG QA:QAR RE:EUR RO:RON RS:RSD RU:RUB RW:RWF SA:SAR SB:SBD SC:SCR SD:SDG SE:SEK SG:SGD SH:SHP
    SI:EUR SK:EUR SL:SLE SM:EUR SN:XOF SO:SOS SR:SRD SS:SSP ST:STN SV:USD SX:ANG SY:SYP SZ:SZL TC:USD TD:XAF
    TG:XOF TH:THB TJ:TJS TK:NZD TL:USD TM:TMT TN:TND TO:TOP TR:TRY TT:TTD TV:AUD TW:TWD TZ:TZS UA:UAH UG:UGX
    UM:USD US:USD UY:UYU UZ:UZS VA:EUR VC:XCD VE:VES VG:USD VI:USD VN:VND VU:VUV WF:XPF WS:WST XK:EUR YE:YER
    YT:EUR ZA:ZAR ZM:ZMW ZW:ZWL
  `.trim().split(/\s+/).map(p => p.split(':')));

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  let rates = null;        // units of currency per 1 USD
  let updatedAt = null;    // Date of source update
  let local = store.get(STORE_LOCAL) || 'THB';
  let place = store.get(STORE_PLACE) || null;   // country code for the headline, if known
  // The "anchor" is the value she last typed; everything else is derived from it.
  let anchor = { code: local, value: parseFloat(store.get(STORE_AMOUNT)) || 100 };

  const currencyNames = (() => { try { return new Intl.DisplayNames(['en'], { type: 'currency' }); } catch { return null; } })();
  const regionNames = (() => { try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; } })();
  const nameOf = (c) => { try { return (currencyNames && currencyNames.of(c)) || c; } catch { return c; } };
  const countryName = (cc) => { try { return (regionNames && regionNames.of(cc)) || cc; } catch { return cc; } };

  // Countries using each currency, for search ("japan" → JPY, "france" → EUR).
  const COUNTRIES_BY_CURRENCY = {};
  for (const [cc, cur] of Object.entries(COUNTRY_CURRENCY)) (COUNTRIES_BY_CURRENCY[cur] ||= []).push(cc);

  // The country a currency "belongs" to, when there is an obvious one (JPY → JP, but not EUR).
  const homeCountry = (c) => (COUNTRY_CURRENCY[c.slice(0, 2)] === c ? c.slice(0, 2) : null);

  // Currency code → flag emoji (first two letters are usually the ISO country).
  const FLAG_OVERRIDE = { EUR: '🇪🇺', XAF: '🌍', XOF: '🌍', XCD: '🌎', XPF: '🌏', ANG: '🇨🇼', XDR: '🌐' };
  const flagOfCountry = (cc) => String.fromCodePoint(...[...cc].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
  const flagOf = (c) => FLAG_OVERRIDE[c] || flagOfCountry(c.slice(0, 2));

  const decimalsOf = (c) => {
    try { return new Intl.NumberFormat('en', { style: 'currency', currency: c }).resolvedOptions().maximumFractionDigits; }
    catch { return 2; }
  };
  const fmt = (n, c) => {
    if (!isFinite(n)) return '';
    const d = Math.abs(n) >= 100000 ? 0 : decimalsOf(c);   // big amounts: whole units are enough
    return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  };

  // Shrink an amount's font until the whole number fits its box (never cut off long numbers).
  const measure = document.createElement('canvas').getContext('2d');
  function fitText(el) {
    el.style.fontSize = '';
    const text = el.value !== undefined ? el.value : el.textContent;
    const cs = getComputedStyle(el);
    const base = parseFloat(cs.fontSize);
    const avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
    if (!text || avail <= 0) return;
    measure.font = `${cs.fontWeight} ${base}px ${cs.fontFamily}`;
    const width = measure.measureText(text).width;
    if (width > avail) el.style.fontSize = Math.max(11, Math.floor(base * avail / width)) + 'px';
  }
  const fitAll = () => document.querySelectorAll('.amt-input, #padResult').forEach(fitText);
  // "1 AED = 0.3849 CAD", but for tiny rates use a bigger base: "1,000 KRW = 1.042 CAD".
  const rateLine = (from, to) => {
    const r = convert(1, from, to);
    const base = r > 0 && r < 0.01 ? 10 ** Math.ceil(-Math.log10(r)) : 1;
    return `${base.toLocaleString('en-US')} ${from} = ${fmtRate(r * base)} ${to}`;
  };
  const fmtRate = (n) => {
    if (n >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    return n.toLocaleString('en-US', { maximumSignificantDigits: 4 });
  };
  const convert = (value, from, to) => value / rates[from] * rates[to];

  // ---------- Rate fetching (two free, key-less sources) ----------
  async function fetchPrimary() {
    const r = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
    const j = await r.json();
    if (j.result !== 'success') throw new Error('bad response');
    return { rates: j.rates, updatedAt: new Date(j.time_last_update_unix * 1000) };
  }
  async function fetchFallback() {
    const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json', { cache: 'no-store' });
    const j = await r.json();
    const out = {};
    for (const [k, v] of Object.entries(j.usd)) {
      if (/^[a-z]{3}$/.test(k) && typeof v === 'number') out[k.toUpperCase()] = v;
    }
    out.USD = 1;
    return { rates: out, updatedAt: new Date(j.date + 'T00:00:00Z') };
  }

  function readSaved() {
    try { return JSON.parse(store.get(STORE_RATES)); } catch { return null; }
  }

  async function loadRates() {
    setStatus('', 'Updating rates…');
    for (const fn of [fetchPrimary, fetchFallback]) {
      try {
        const res = await fn();
        rates = res.rates; updatedAt = res.updatedAt;
        store.set(STORE_RATES, JSON.stringify({ rates, updatedAt: updatedAt.toISOString(), fetchedAt: Date.now() }));
        afterRates(true);
        return;
      } catch { /* try next source */ }
    }
    // Both failed — use saved rates if we have them (e.g. no wifi on board).
    const saved = readSaved();
    if (saved) {
      rates = saved.rates; updatedAt = new Date(saved.updatedAt);
      afterRates(false);
    } else {
      setStatus('err', 'Can’t load rates. Check your connection.');
    }
  }

  function timeAgo(d) {
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 90) return 'just now';
    const m = Math.round(s / 60);
    if (m < 90) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 36) return `${h} hr ago`;
    return `${Math.round(h / 24)} days ago`;
  }

  function setStatus(kind, text) {
    $('dot').className = 'dot' + (kind ? ' ' + kind : '');
    $('statusText').textContent = text;
  }

  let lastLive = false;
  function refreshStatus() {
    if (!updatedAt) return;
    if (lastLive) setStatus('live', `Live rates · updated ${timeAgo(updatedAt)}`);
    else setStatus('stale', `Offline · saved rates from ${updatedAt.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`);
  }

  function afterRates(live) {
    lastLive = live;
    if (!rates[local]) local = 'USD';
    refreshStatus();
    render();
    if (document.body.classList.contains('picking')) renderResults();
  }

  // ---------- Main view ----------
  function renderHero(detected) {
    const cc = place && COUNTRY_CURRENCY[place] === local ? place : homeCountry(local);
    $('eyebrow').textContent = detected ? 'You’re in' : 'Local currency';
    $('place').textContent = cc ? countryName(cc) : nameOf(local);
    $('placeSub').textContent = cc ? `${nameOf(local)} · ${local}` : local;
  }

  let heroDetected = false;
  function render() {
    renderHero(heroDetected);
    if (!rates) return;
    if (!rates[anchor.code]) anchor = { code: local, value: anchor.value };

    const localCard = $('localCard');
    if (localCard.dataset.code !== local) {
      localCard.dataset.code = local;
      localCard.innerHTML = `
        <div class="local-head">
          <span class="flag">${flagOf(local)}</span>
          <span class="code">${local}</span>
          <span class="name">${esc(nameOf(local))}</span>
        </div>
        <div class="amount-field">
          <input class="big amt-input" data-code="${local}" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="${esc(nameOf(local))} amount">
          <button class="calc-btn" type="button" data-calc="${local}" aria-label="Calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="8" y="5.5" width="8" height="3.5" rx="1" fill="currentColor" opacity=".55"/><g fill="currentColor"><circle cx="9" cy="12.5" r="1.1"/><circle cx="12" cy="12.5" r="1.1"/><circle cx="15" cy="12.5" r="1.1"/><circle cx="9" cy="16.5" r="1.1"/><circle cx="12" cy="16.5" r="1.1"/><circle cx="15" cy="16.5" r="1.1"/></g></svg></button>
        </div>
        <div class="hint" id="localHint"></div>`;
    }

    const codes = FAVOURITES.filter(c => c !== local && rates[c]);
    const rowsEl = $('rows');
    // Rebuild rows only if the set of currencies changed (keeps focus while typing).
    if (rowsEl.dataset.codes !== codes.join(',')) {
      rowsEl.dataset.codes = codes.join(',');
      rowsEl.innerHTML = codes.map(c => `
        <div class="row">
          <span class="flag">${flagOf(c)}</span>
          <div>
            <div class="code">${c}</div>
            <div class="rate" data-rate="${c}"></div>
          </div>
          <div class="amount-field small">
            <input class="amt amt-input" data-code="${c}" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="${esc(nameOf(c))} amount">
            <button class="calc-btn" type="button" data-calc="${c}" aria-label="Calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="8" y="5.5" width="8" height="3.5" rx="1" fill="currentColor" opacity=".55"/><g fill="currentColor"><circle cx="9" cy="12.5" r="1.1"/><circle cx="12" cy="12.5" r="1.1"/><circle cx="15" cy="12.5" r="1.1"/><circle cx="9" cy="16.5" r="1.1"/><circle cx="12" cy="16.5" r="1.1"/><circle cx="15" cy="16.5" r="1.1"/></g></svg></button>
          </div>
        </div>`).join('');
    }

    for (const input of document.querySelectorAll('.amt-input')) {
      const c = input.dataset.code;
      input.classList.toggle('editing', pad.open && pad.code === c);
      if (document.activeElement === input && c === anchor.code) continue; // don't reformat what she's typing
      input.value = fmt(convert(anchor.value, anchor.code, c), c);
    }
    for (const el of rowsEl.querySelectorAll('[data-rate]')) {
      const c = el.dataset.rate;
      el.textContent = rateLine(c, local);
    }
    const ref = local === 'USD' ? 'AED' : 'USD';
    $('localHint').textContent = rateLine(local, ref);
    fitAll();
  }

  function setLocal(code, cc) {
    // Keep the amount meaningful when switching country.
    if (rates && rates[anchor.code] && !FAVOURITES.includes(anchor.code)) {
      const usd = convert(anchor.value, anchor.code, 'USD');
      anchor = { code, value: Math.round(convert(usd, 'USD', code)) || 100 };
    } else if (!rates) {
      anchor = { code, value: anchor.value };
    }
    local = code;
    place = cc || homeCountry(code);
    store.set(STORE_LOCAL, code);
    store.set(STORE_PLACE, place || '');
    const recent = [code, ...readRecent().filter(c => c !== code)].slice(0, 5);
    store.set(STORE_RECENT, JSON.stringify(recent));
    render();
  }

  function readRecent() {
    try { return JSON.parse(store.get(STORE_RECENT)) || []; } catch { return []; }
  }

  // ---------- Currency picker (search instead of a long list) ----------
  function searchCurrencies(q) {
    const query = q.trim().toLowerCase();
    const codes = Object.keys(rates || {}).filter(c => /^[A-Z]{3}$/.test(c));
    if (!query) return null;
    const hits = [];
    for (const c of codes) {
      const name = nameOf(c).toLowerCase();
      let score = 0, via = null;
      if (c.toLowerCase() === query) score = 100;
      else if (c.toLowerCase().startsWith(query)) score = 80;
      else if (name.startsWith(query)) score = 70;
      else if (name.split(/\s+/).some(w => w.startsWith(query))) score = 60;
      else if (name.includes(query)) score = 40;
      // Country match (keeps the country for the headline).
      for (const cc of COUNTRIES_BY_CURRENCY[c] || []) {
        const cn = countryName(cc).toLowerCase();
        let s = 0;
        if (cn === query) s = 95;
        else if (cn.startsWith(query)) s = 75;
        else if (cn.split(/[\s-]+/).some(w => w.startsWith(query))) s = 55;
        else if (query.length > 2 && cn.includes(query)) s = 35;
        if (s > score) { score = s; via = cc; }
      }
      if (score) hits.push({ code: c, via, score });
    }
    return hits.sort((a, b) => b.score - a.score || nameOf(a.code).localeCompare(nameOf(b.code))).slice(0, 40);
  }

  function optHtml({ code, via }) {
    const title = via ? countryName(via) : nameOf(code);
    const sub = via ? nameOf(code) : (homeCountry(code) ? countryName(homeCountry(code)) : '');
    return `<button class="opt${code === local ? ' selected' : ''}" type="button" data-code="${code}" data-cc="${via || ''}">
      <span class="flag">${via ? flagOfCountry(via) : flagOf(code)}</span>
      <span><div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</span>
      <span class="c">${code}</span>
    </button>`;
  }

  let firstResult = null;
  function renderResults() {
    const out = $('results');
    if (!rates) { out.innerHTML = '<p class="empty">Rates are still loading…</p>'; return; }
    const hits = searchCurrencies($('search').value);
    if (hits) {
      firstResult = hits[0] || null;
      out.innerHTML = hits.length
        ? `<div class="group">${hits.map(optHtml).join('')}</div>`
        : `<p class="empty">No currency matches “${esc($('search').value)}”.<br>Try a country (Japan), a currency (yen) or a code (JPY).</p>`;
      return;
    }
    firstResult = null;
    const recent = readRecent().filter(c => rates[c]);
    const suggested = SUGGESTED.filter(c => rates[c] && !recent.includes(c));
    out.innerHTML =
      (recent.length ? `<div class="group-label">Recent</div><div class="group">${recent.map(code => optHtml({ code })).join('')}</div>` : '') +
      `<div class="group-label">Popular destinations</div><div class="group">${suggested.map(code => optHtml({ code })).join('')}</div>` +
      `<div class="group-label">Your currencies</div><div class="group">${FAVOURITES.map(code => optHtml({ code })).join('')}</div>`;
  }

  function openPicker() {
    $('search').value = '';
    renderResults();
    document.body.classList.add('picking');
    $('results').scrollTop = 0;
    setTimeout(() => $('search').focus(), 50);
  }
  function closePicker() {
    document.body.classList.remove('picking');
    $('search').blur();
  }

  // ---------- Events ----------
  // ---------- Typing an amount with the phone keyboard ----------
  const parse = (s) => parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  document.addEventListener('input', (e) => {
    const input = e.target.closest('.amt-input');
    if (!input) return;
    const v = parse(input.value);
    anchor = { code: input.dataset.code, value: isFinite(v) ? v : 0 };
    store.set(STORE_AMOUNT, String(convert(anchor.value, anchor.code, local)));
    render();
  });
  document.addEventListener('focusin', (e) => {
    if (!e.target.matches('.amt-input')) return;
    closePad();
    setTimeout(() => { try { e.target.setSelectionRange(0, e.target.value.length); } catch { e.target.select(); } }, 0);
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.matches('.amt-input')) render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('.amt-input')) e.target.blur();
  });

  // ---------- Calculator keypad (+ − × ÷), opened from the calculator icon ----------
  const pad = { open: false, code: null, expr: '', fresh: true };
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  // Evaluate "12.5+30-4*2" with normal precedence; a trailing operator is ignored.
  function evaluate(expr) {
    const tokens = expr.replace(/[+\-*/]$/, '').match(/\d*\.?\d+|\d+\.|[+\-*/]/g);
    if (!tokens) return 0;
    const terms = [];
    let op = '+', cur = null;
    for (const t of tokens) {
      if ('+-*/'.includes(t)) { op = t; continue; }
      const n = parseFloat(t);
      if (op === '*' && terms.length) terms[terms.length - 1] *= n;
      else if (op === '/' && terms.length) terms[terms.length - 1] = n === 0 ? NaN : terms[terms.length - 1] / n;
      else terms.push(op === '-' ? -n : n);
    }
    const total = terms.reduce((a, b) => a + b, 0);
    return isFinite(total) ? Math.round(total * 1e8) / 1e8 : NaN;
  }

  function prettyExpr(expr) {
    return expr.replace(/[+\-*/]/g, (o) => ` ${OPS[o]} `).replace(/\d+(\.\d*)?/g, (n) => {
      const [i, d] = n.split('.');
      return Number(i).toLocaleString('en-US') + (d !== undefined ? '.' + d : '');
    });
  }

  function renderPad() {
    const value = evaluate(pad.expr || '0');
    $('padFlag').textContent = flagOf(pad.code);
    $('padCode').textContent = pad.code;
    $('padExpr').textContent = /[+\-*/]/.test(pad.expr) ? prettyExpr(pad.expr) : '';
    $('padResult').textContent = isFinite(value) ? fmt(value, pad.code) : 'Can’t divide by 0';
    const others = [...new Set([local, ...FAVOURITES])].filter(c => c !== pad.code && rates[c]);
    $('padConv').innerHTML = isFinite(value)
      ? others.map(c => `<span>${flagOf(c)} <b>${fmt(convert(value, pad.code, c), c)}</b> ${c}</span>`).join('') : '';
    if (isFinite(value)) {
      anchor = { code: pad.code, value };
      store.set(STORE_AMOUNT, String(convert(anchor.value, anchor.code, local)));
    }
    render();
  }

  function openPad(code) {
    if (!rates) return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // hide the phone keyboard
    pad.open = true;
    pad.code = code;
    // Start from the amount shown in that box; the first number typed replaces it.
    const v = convert(anchor.value, anchor.code, code);
    pad.expr = String(Math.round(v * 10 ** decimalsOf(code)) / 10 ** decimalsOf(code));
    pad.fresh = true;
    document.body.classList.add('padding');
    renderPad();
  }
  function closePad() {
    if (!pad.open) return;
    pad.open = false;
    document.body.classList.remove('padding');
    render();
  }

  function pressKey(k) {
    const last = pad.expr.slice(-1);
    const isOp = (c) => '+-*/'.includes(c);
    if (/^\d$/.test(k) || k === '.') {
      if (pad.fresh) { pad.expr = ''; pad.fresh = false; }
      const lastNum = pad.expr.split(/[+\-*/]/).pop();
      if (k === '.' && lastNum.includes('.')) return;
      if (k !== '.' && lastNum === '0') pad.expr = pad.expr.slice(0, -1);   // no leading zeros
      if (lastNum.replace('.', '').length >= 12) return;
      pad.expr += (k === '.' && lastNum === '') ? '0.' : k;
    } else if (isOp(k)) {
      pad.fresh = false;
      if (pad.expr === '') pad.expr = '0';
      pad.expr = isOp(last) ? pad.expr.slice(0, -1) + k : pad.expr + k;
    } else if (k === 'back') {
      pad.fresh = false;
      pad.expr = pad.expr.slice(0, -1);
    } else if (k === 'clear') {
      pad.expr = ''; pad.fresh = false;
    } else if (k === '=') {
      const v = evaluate(pad.expr || '0');
      if (isFinite(v)) { pad.expr = String(v); pad.fresh = true; }
    } else if (k === 'done') {
      closePad(); return;
    }
    renderPad();
  }

  document.addEventListener('click', (e) => {
    const calc = e.target.closest('[data-calc]');
    if (calc) { openPad(calc.dataset.calc); return; }
    const key = e.target.closest('[data-key]');
    if (key) { pressKey(key.dataset.key); return; }
    if (pad.open && !e.target.closest('#pad')) closePad();
  });
  document.addEventListener('keydown', (e) => {
    if (!pad.open) return;
    const map = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'done', Delete: 'clear', x: '*', X: '*' };
    const k = map[e.key] || e.key;
    if (/^[\d.+\-*/]$/.test(k) || ['=', 'back', 'done', 'clear'].includes(k)) { e.preventDefault(); pressKey(k); }
  });

  $('changeBtn').addEventListener('click', openPicker);
  $('doneBtn').addEventListener('click', closePicker);
  $('scrim').addEventListener('click', closePicker);
  $('search').addEventListener('input', renderResults);
  $('search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && firstResult) {
      heroDetected = false;
      setLocal(firstResult.code, firstResult.via);
      closePicker();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('picking')) closePicker();
  });
  $('results').addEventListener('click', (e) => {
    const b = e.target.closest('.opt');
    if (!b) return;
    heroDetected = false;
    setLocal(b.dataset.code, b.dataset.cc || null);
    closePicker();
  });

  $('refreshBtn').addEventListener('click', loadRates);

  // Day/night button: Auto → Light → Dark.
  const THEME_ICONS = {
    auto: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M3.05 12.95l1.13-1.13M11.82 4.18l1.13-1.13"/></g></svg>',
    dark: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>',
  };
  const THEME_LABELS = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  CrewTheme.onChange((mode, theme) => {
    const btn = $('themeBtn');
    btn.innerHTML = THEME_ICONS[mode] + THEME_LABELS[mode];
    btn.title = mode === 'auto' ? `Auto: ${theme === 'dark' ? 'night' : 'day'} where you are (switches at sunrise/sunset)` : `${THEME_LABELS[mode]} mode`;
  });
  $('themeBtn').addEventListener('click', () => CrewTheme.cycle());
  $('locateBtn').addEventListener('click', () => detectLocation(true));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    CrewTheme.apply();
    loadRates();
    detectLocation(false);
  });

  // ---------- Location → local currency ----------
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(resolve, reject,
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 15 * 60 * 1000 });
    });
  }

  // GPS / network position, turned into a country code.
  async function countryFromGps() {
    const { latitude, longitude } = (await getPosition()).coords;
    CrewTheme.setCoords(latitude, longitude);   // for sunrise/sunset in Auto mode
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
    const j = await r.json();
    if (!j.countryCode) throw new Error('no country');
    return j.countryCode.toUpperCase();
  }

  // IP-based fallback (no permission needed, but can be wrong when roaming on a home SIM).
  async function countryFromIp() {
    const r = await fetch('https://get.geojs.io/v1/ip/country.json');
    const j = await r.json();
    if (!j.country) throw new Error('no country');
    return j.country.toUpperCase();
  }

  let detecting = false;
  let lastDetect = 0;
  async function detectLocation(manual) {
    if (detecting) return;
    if (!manual && Date.now() - lastDetect < DETECT_EVERY_MS) return;
    detecting = true;
    lastDetect = Date.now();
    const btn = $('locateBtn');
    btn.disabled = true;
    btn.textContent = 'Locating…';
    let cc = null;
    try { cc = await countryFromGps(); }
    catch { try { cc = await countryFromIp(); } catch {} }
    btn.disabled = false;
    btn.textContent = 'Use my location';
    detecting = false;

    const cur = cc && COUNTRY_CURRENCY[cc];
    if (!cur) {
      if (manual) setStatus('err', 'Couldn’t find your location. Choose a currency instead.');
      return;
    }
    // Only switch when she has moved to a new country (or asked), so a manual pick sticks until the next trip.
    if (manual || cc !== store.get(STORE_COUNTRY)) {
      store.set(STORE_COUNTRY, cc);
      if (!rates || rates[cur]) {
        heroDetected = true;
        setLocal(cur, cc);
      }
    } else if (local === cur) {
      heroDetected = true;
      place = cc;
      render();
    }
  }

  // ---------- Fit to the visible screen ----------
  function fitHeight() {
    const h = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  fitHeight();
  window.addEventListener('resize', () => {
    // Ignore the keyboard opening (it only shrinks the visual viewport); refit on real size changes.
    if (!document.activeElement || !document.activeElement.matches('input')) fitHeight();
  });
  window.addEventListener('orientationchange', () => setTimeout(fitHeight, 300));
  window.addEventListener('pageshow', fitHeight);
  window.addEventListener('resize', () => fitAll());

  // ---------- Offline: keep the app on the phone so it opens without signal ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // ---------- Start ----------
  const saved = readSaved();
  if (saved && saved.rates) {
    rates = saved.rates; updatedAt = new Date(saved.updatedAt);
    afterRates(false);
  } else {
    render();
  }
  loadRates();
  detectLocation(false);
  setInterval(loadRates, REFRESH_MS);
  setInterval(refreshStatus, 30 * 1000);
})();
</script>
</body>
</html>
