<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crew FX">
<title>Crew FX</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #86868b;
    --hairline: #d2d2d7;
    --blue: #0071e3;
    --link: #0066cc;
    --field: #f5f5f7;
    --nav: rgba(245, 245, 247, 0.8);
    --scrim: rgba(0, 0, 0, 0.32);
    --live: #34c759;
    --stale: #ff9f0a;
    --err: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #8e8e93;
      --hairline: #38383a;
      --blue: #0a84ff;
      --link: #2997ff;
      --field: #2c2c2e;
      --nav: rgba(22, 22, 23, 0.8);
      --scrim: rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  input { font: inherit; letter-spacing: inherit; }

  /* ---------- One-screen layout ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- Top bar ---------- */
  .top {
    flex: none;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .nav-link {
    background: none;
    border: 0;
    padding: 6px 0;
    font-size: 14px;
    color: var(--link);
    cursor: pointer;
  }

  /* ---------- Hero ---------- */
  /* The hero soaks up spare height on tall phones, keeping the amounts low within thumb reach. */
  .hero {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 4px 0 14px;
  }
  .eyebrow { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 0; }
  .hero h1 {
    font-size: clamp(30px, 9vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.005em;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero .sub { font-size: 17px; line-height: 1.25; color: var(--ink); margin: 2px 0 0; }
  .ctas { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 18px;
    border-radius: 980px;
    font-size: 15px;
    cursor: pointer;
    border: 1px solid var(--blue);
    white-space: nowrap;
    transition: background-color .2s, opacity .2s;
  }
  .pill.primary { background: var(--blue); color: #fff; }
  .pill.secondary { background: transparent; color: var(--blue); }
  .pill:active { opacity: .7; }
  .pill:disabled { opacity: .5; cursor: default; }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -0.01em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.live { background: var(--live); }
  .dot.stale { background: var(--stale); }
  .dot.err { background: var(--err); }

  /* ---------- Converter ---------- */
  .card { background: var(--surface); border-radius: 18px; overflow: hidden; }
  .local-card { flex: none; padding: 14px 18px 12px; }
  .local-head { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .local-head .flag { font-size: 22px; line-height: 1; }
  .local-head .code { font-weight: 600; }
  .local-head .name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input.big {
    display: block;
    width: 100%;
    margin-top: 2px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    padding: 0;
    outline: none;
    caret-color: var(--blue);
  }
  .local-card .hint { font-size: 13px; color: var(--ink-3); }

  .section-title {
    flex: none;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--ink-2);
    margin: 14px 18px 6px;
  }
  /* Rows shrink evenly on short screens so the whole page fits without scrolling. */
  #rows {
    flex: 0 1 auto;
    min-height: 0;
    display: grid;
    grid-auto-rows: minmax(0, 80px);
  }
  .row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 12px;
    padding: 0 14px 0 18px;
    min-height: 0;
    position: relative;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    top: 0; right: 0; left: 62px;
    border-top: 0.5px solid var(--hairline);
  }
  .row .flag { font-size: 26px; line-height: 1; }
  .row .code { font-weight: 600; font-size: 17px; line-height: 1.2; }
  .row .rate { font-size: 13px; color: var(--ink-2); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input.amt {
    width: 34vw;
    max-width: 200px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    text-align: right;
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 6px 8px;
    outline: none;
    transition: background-color .15s;
    caret-color: var(--blue);
  }
  input.amt:focus { background: var(--field); }

  /* Small phones (iPhone SE / mini): tighten the top half. */
  @media (max-height: 700px) {
    .hero { padding-bottom: 10px; }
    .hero h1 { font-size: 30px; }
    .hero .sub { font-size: 15px; }
    .ctas { margin-top: 8px; }
    .status { margin-top: 6px; }
    input.big { font-size: 34px; }
    .section-title { margin: 10px 18px 4px; }
  }

  /* ---------- Currency picker sheet ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 20;
    background: var(--scrim);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .sheet {
    position: fixed; z-index: 21;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    max-width: 680px;
    height: min(88vh, 720px);
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.32, .72, 0, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.picking .scrim { opacity: 1; pointer-events: auto; }
  body.picking .sheet { transform: translateY(0); }
  body.picking { overflow: hidden; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 8px auto 0; }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 8px;
  }
  .sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .search {
    margin: 0 16px 8px;
    display: flex; align-items: center; gap: 8px;
    background: var(--field);
    border-radius: 12px;
    padding: 0 12px;
    height: 44px;
  }
  @media (prefers-color-scheme: light) { .search { background: rgba(118, 118, 128, .12); } }
  .search svg { flex: none; color: var(--ink-3); }
  .search input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; outline: none;
    color: var(--ink);
    font-size: 17px;
  }
  .search input::placeholder { color: var(--ink-3); }
  .results { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; flex: 1; }
  .group-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0;
    color: var(--ink-2);
    margin: 16px 4px 6px;
  }
  .opt {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    column-gap: 12px;
    width: 100%;
    padding: 11px 16px;
    background: var(--surface);
    border: 0;
    text-align: left;
    cursor: pointer;
    position: relative;
  }
  .opt:first-of-type { border-radius: 12px 12px 0 0; }
  .opt:last-of-type { border-radius: 0 0 12px 12px; }
  .opt:only-of-type { border-radius: 12px; }
  .opt + .opt::before {
    content: ""; position: absolute; top: 0; right: 0; left: 60px;
    border-top: 0.5px solid var(--hairline);
  }
  .opt:active { background: var(--field); }
  .opt .flag { font-size: 24px; line-height: 1; }
  .opt .t { font-size: 17px; }
  .opt .s { font-size: 13px; color: var(--ink-2); }
  .opt .c { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .opt.selected .c { color: var(--blue); font-weight: 600; }
  .empty { color: var(--ink-2); text-align: center; padding: 32px 16px; font-size: 15px; }
  .group { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icons/icon.svg" alt="">Crew FX</div>
    <button class="nav-link" id="refreshBtn" type="button">Refresh rates</button>
  </header>

  <section class="hero">
    <p class="eyebrow" id="eyebrow">Local currency</p>
    <h1 id="place">—</h1>
    <p class="sub" id="placeSub">Loading…</p>
    <div class="ctas">
      <button class="pill primary" id="changeBtn" type="button">Change currency</button>
      <button class="pill secondary" id="locateBtn" type="button">Use my location</button>
    </div>
    <div><span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading live rates…</span></span></div>
  </section>

  <div class="card local-card" id="localCard"></div>
  <h2 class="section-title">Converted · tap any amount to edit</h2>
  <div class="card" id="rows"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Choose currency</h2>
    <button class="nav-link" id="doneBtn" type="button" style="font-size:17px">Done</button>
  </div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Country, currency or code" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  </label>
  <div class="results" id="results"></div>
</div>

<script>
(() => {
  // Her most used currencies, always shown.
  const FAVOURITES = ['AED', 'KRW', 'CAD', 'USD'];
  const REFRESH_MS = 5 * 60 * 1000;
  const DETECT_EVERY_MS = 30 * 60 * 1000;
  const STORE_RATES = 'crewfx.rates';
  const STORE_LOCAL = 'crewfx.local';
  const STORE_AMOUNT = 'crewfx.amount';
  const STORE_COUNTRY = 'crewfx.country';   // last detected country
  const STORE_PLACE = 'crewfx.place';       // country shown in the headline
  const STORE_RECENT = 'crewfx.recent';

  // Common crew destinations suggested in the picker.
  const SUGGESTED = ['THB', 'EUR', 'GBP', 'JPY', 'INR', 'SGD', 'HKD', 'AUD', 'CNY', 'SAR', 'QAR', 'TRY'];

  // ISO country code → currency code.
  const COUNTRY_CURRENCY = Object.fromEntries(`
    AD:EUR AE:AED AF:AFN AG:XCD AI:XCD AL:ALL AM:AMD AO:AOA AR:ARS AS:USD AT:EUR AU:AUD AW:AWG AX:EUR AZ:AZN
    BA:BAM BB:BBD BD:BDT BE:EUR BF:XOF BG:BGN BH:BHD BI:BIF BJ:XOF BL:EUR BM:BMD BN:BND BO:BOB BQ:USD BR:BRL
    BS:BSD BT:BTN BW:BWP BY:BYN BZ:BZD CA:CAD CC:AUD CD:CDF CF:XAF CG:XAF CH:CHF CI:XOF CK:NZD CL:CLP CM:XAF
    CN:CNY CO:COP CR:CRC CU:CUP CV:CVE CW:ANG CX:AUD CY:EUR CZ:CZK DE:EUR DJ:DJF DK:DKK DM:XCD DO:DOP DZ:DZD
    EC:USD EE:EUR EG:EGP EH:MAD ER:ERN ES:EUR ET:ETB FI:EUR FJ:FJD FK:FKP FM:USD FO:DKK FR:EUR GA:XAF GB:GBP
    GD:XCD GE:GEL GF:EUR GG:GBP GH:GHS GI:GIP GL:DKK GM:GMD GN:GNF GP:EUR GQ:XAF GR:EUR GT:GTQ GU:USD GW:XOF
    GY:GYD HK:HKD HN:HNL HR:EUR HT:HTG HU:HUF ID:IDR IE:EUR IL:ILS IM:GBP IN:INR IO:USD IQ:IQD IR:IRR IS:ISK
    IT:EUR JE:GBP JM:JMD JO:JOD JP:JPY KE:KES KG:KGS KH:KHR KI:AUD KM:KMF KN:XCD KP:KPW KR:KRW KW:KWD KY:KYD
    KZ:KZT LA:LAK LB:LBP LC:XCD LI:CHF LK:LKR LR:LRD LS:LSL LT:EUR LU:EUR LV:EUR LY:LYD MA:MAD MC:EUR MD:MDL
    ME:EUR MF:EUR MG:MGA MH:USD MK:MKD ML:XOF MM:MMK MN:MNT MO:MOP MP:USD MQ:EUR MR:MRU MS:XCD MT:EUR MU:MUR
    MV:MVR MW:MWK MX:MXN MY:MYR MZ:MZN NA:NAD NC:XPF NE:XOF NF:AUD NG:NGN NI:NIO NL:EUR NO:NOK NP:NPR NR:AUD
    NU:NZD NZ:NZD OM:OMR PA:PAB PE:PEN PF:XPF PG:PGK PH:PHP PK:PKR PL:PLN PM:EUR PN:NZD PR:USD PS:ILS PT:EUR
    PW:USD PY:PYG QA:QAR RE:EUR RO:RON RS:RSD RU:RUB RW:RWF SA:SAR SB:SBD SC:SCR SD:SDG SE:SEK SG:SGD SH:SHP
    SI:EUR SK:EUR SL:SLE SM:EUR SN:XOF SO:SOS SR:SRD SS:SSP ST:STN SV:USD SX:ANG SY:SYP SZ:SZL TC:USD TD:XAF
    TG:XOF TH:THB TJ:TJS TK:NZD TL:USD TM:TMT TN:TND TO:TOP TR:TRY TT:TTD TV:AUD TW:TWD TZ:TZS UA:UAH UG:UGX
    UM:USD US:USD UY:UYU UZ:UZS VA:EUR VC:XCD VE:VES VG:USD VI:USD VN:VND VU:VUV WF:XPF WS:WST XK:EUR YE:YER
    YT:EUR ZA:ZAR ZM:ZMW ZW:ZWL
  `.trim().split(/\s+/).map(p => p.split(':')));

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  let rates = null;        // units of currency per 1 USD
  let updatedAt = null;    // Date of source update
  let local = store.get(STORE_LOCAL) || 'THB';
  let place = store.get(STORE_PLACE) || null;   // country code for the headline, if known
  // The "anchor" is the value she last typed; everything else is derived from it.
  let anchor = { code: local, value: parseFloat(store.get(STORE_AMOUNT)) || 100 };

  const currencyNames = (() => { try { return new Intl.DisplayNames(['en'], { type: 'currency' }); } catch { return null; } })();
  const regionNames = (() => { try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; } })();
  const nameOf = (c) => { try { return (currencyNames && currencyNames.of(c)) || c; } catch { return c; } };
  const countryName = (cc) => { try { return (regionNames && regionNames.of(cc)) || cc; } catch { return cc; } };

  // Countries using each currency, for search ("japan" → JPY, "france" → EUR).
  const COUNTRIES_BY_CURRENCY = {};
  for (const [cc, cur] of Object.entries(COUNTRY_CURRENCY)) (COUNTRIES_BY_CURRENCY[cur] ||= []).push(cc);

  // The country a currency "belongs" to, when there is an obvious one (JPY → JP, but not EUR).
  const homeCountry = (c) => (COUNTRY_CURRENCY[c.slice(0, 2)] === c ? c.slice(0, 2) : null);

  // Currency code → flag emoji (first two letters are usually the ISO country).
  const FLAG_OVERRIDE = { EUR: '🇪🇺', XAF: '🌍', XOF: '🌍', XCD: '🌎', XPF: '🌏', ANG: '🇨🇼', XDR: '🌐' };
  const flagOfCountry = (cc) => String.fromCodePoint(...[...cc].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
  const flagOf = (c) => FLAG_OVERRIDE[c] || flagOfCountry(c.slice(0, 2));

  const decimalsOf = (c) => {
    try { return new Intl.NumberFormat('en', { style: 'currency', currency: c }).resolvedOptions().maximumFractionDigits; }
    catch { return 2; }
  };
  const fmt = (n, c) => {
    if (!isFinite(n)) return '';
    const d = decimalsOf(c);
    return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const fmtRate = (n) => {
    if (n >= 100) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return n.toLocaleString('en-US', { maximumSignificantDigits: 4 });
  };
  const parse = (s) => parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  const convert = (value, from, to) => value / rates[from] * rates[to];

  // ---------- Rate fetching (two free, key-less sources) ----------
  async function fetchPrimary() {
    const r = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
    const j = await r.json();
    if (j.result !== 'success') throw new Error('bad response');
    return { rates: j.rates, updatedAt: new Date(j.time_last_update_unix * 1000) };
  }
  async function fetchFallback() {
    const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json', { cache: 'no-store' });
    const j = await r.json();
    const out = {};
    for (const [k, v] of Object.entries(j.usd)) {
      if (/^[a-z]{3}$/.test(k) && typeof v === 'number') out[k.toUpperCase()] = v;
    }
    out.USD = 1;
    return { rates: out, updatedAt: new Date(j.date + 'T00:00:00Z') };
  }

  function readSaved() {
    try { return JSON.parse(store.get(STORE_RATES)); } catch { return null; }
  }

  async function loadRates() {
    setStatus('', 'Updating rates…');
    for (const fn of [fetchPrimary, fetchFallback]) {
      try {
        const res = await fn();
        rates = res.rates; updatedAt = res.updatedAt;
        store.set(STORE_RATES, JSON.stringify({ rates, updatedAt: updatedAt.toISOString(), fetchedAt: Date.now() }));
        afterRates(true);
        return;
      } catch { /* try next source */ }
    }
    // Both failed — use saved rates if we have them (e.g. no wifi on board).
    const saved = readSaved();
    if (saved) {
      rates = saved.rates; updatedAt = new Date(saved.updatedAt);
      afterRates(false);
    } else {
      setStatus('err', 'Can’t load rates. Check your connection.');
    }
  }

  function timeAgo(d) {
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 90) return 'just now';
    const m = Math.round(s / 60);
    if (m < 90) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 36) return `${h} hr ago`;
    return `${Math.round(h / 24)} days ago`;
  }

  function setStatus(kind, text) {
    $('dot').className = 'dot' + (kind ? ' ' + kind : '');
    $('statusText').textContent = text;
  }

  let lastLive = false;
  function refreshStatus() {
    if (!updatedAt) return;
    if (lastLive) setStatus('live', `Live rates · updated ${timeAgo(updatedAt)}`);
    else setStatus('stale', `Offline · saved rates from ${updatedAt.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`);
  }

  function afterRates(live) {
    lastLive = live;
    if (!rates[local]) local = 'USD';
    refreshStatus();
    render();
    if (document.body.classList.contains('picking')) renderResults();
  }

  // ---------- Main view ----------
  function renderHero(detected) {
    const cc = place && COUNTRY_CURRENCY[place] === local ? place : homeCountry(local);
    $('eyebrow').textContent = detected ? 'You’re in' : 'Local currency';
    $('place').textContent = cc ? countryName(cc) : nameOf(local);
    $('placeSub').textContent = cc ? `${nameOf(local)} · ${local}` : local;
  }

  let heroDetected = false;
  function render() {
    renderHero(heroDetected);
    if (!rates) return;
    if (!rates[anchor.code]) anchor = { code: local, value: anchor.value };

    const localCard = $('localCard');
    if (localCard.dataset.code !== local) {
      localCard.dataset.code = local;
      localCard.innerHTML = `
        <div class="local-head">
          <span class="flag">${flagOf(local)}</span>
          <span class="code">${local}</span>
          <span class="name">${esc(nameOf(local))}</span>
        </div>
        <input class="big amt-input" data-code="${local}" inputmode="decimal" autocomplete="off" aria-label="${esc(nameOf(local))} amount">
        <div class="hint" id="localHint"></div>`;
    }

    const codes = FAVOURITES.filter(c => c !== local && rates[c]);
    const rowsEl = $('rows');
    // Rebuild rows only if the set of currencies changed (keeps focus while typing).
    if (rowsEl.dataset.codes !== codes.join(',')) {
      rowsEl.dataset.codes = codes.join(',');
      rowsEl.innerHTML = codes.map(c => `
        <div class="row">
          <span class="flag">${flagOf(c)}</span>
          <div>
            <div class="code">${c}</div>
            <div class="rate" data-rate="${c}"></div>
          </div>
          <input class="amt amt-input" data-code="${c}" inputmode="decimal" autocomplete="off" aria-label="${esc(nameOf(c))} amount">
        </div>`).join('');
    }

    for (const input of document.querySelectorAll('.amt-input')) {
      const c = input.dataset.code;
      if (document.activeElement === input && c === anchor.code) continue; // don't reformat what she's typing
      input.value = fmt(convert(anchor.value, anchor.code, c), c);
    }
    for (const el of rowsEl.querySelectorAll('[data-rate]')) {
      const c = el.dataset.rate;
      el.textContent = `1 ${c} = ${fmtRate(convert(1, c, local))} ${local}`;
    }
    const ref = local === 'USD' ? 'AED' : 'USD';
    $('localHint').textContent = `1 ${local} = ${fmtRate(convert(1, local, ref))} ${ref}`;
  }

  function setLocal(code, cc) {
    // Keep the amount meaningful when switching country.
    if (rates && rates[anchor.code] && !FAVOURITES.includes(anchor.code)) {
      const usd = convert(anchor.value, anchor.code, 'USD');
      anchor = { code, value: Math.round(convert(usd, 'USD', code)) || 100 };
    } else if (!rates) {
      anchor = { code, value: anchor.value };
    }
    local = code;
    place = cc || homeCountry(code);
    store.set(STORE_LOCAL, code);
    store.set(STORE_PLACE, place || '');
    const recent = [code, ...readRecent().filter(c => c !== code)].slice(0, 5);
    store.set(STORE_RECENT, JSON.stringify(recent));
    render();
  }

  function readRecent() {
    try { return JSON.parse(store.get(STORE_RECENT)) || []; } catch { return []; }
  }

  // ---------- Currency picker (search instead of a long list) ----------
  function searchCurrencies(q) {
    const query = q.trim().toLowerCase();
    const codes = Object.keys(rates || {}).filter(c => /^[A-Z]{3}$/.test(c));
    if (!query) return null;
    const hits = [];
    for (const c of codes) {
      const name = nameOf(c).toLowerCase();
      let score = 0, via = null;
      if (c.toLowerCase() === query) score = 100;
      else if (c.toLowerCase().startsWith(query)) score = 80;
      else if (name.startsWith(query)) score = 70;
      else if (name.split(/\s+/).some(w => w.startsWith(query))) score = 60;
      else if (name.includes(query)) score = 40;
      // Country match (keeps the country for the headline).
      for (const cc of COUNTRIES_BY_CURRENCY[c] || []) {
        const cn = countryName(cc).toLowerCase();
        let s = 0;
        if (cn === query) s = 95;
        else if (cn.startsWith(query)) s = 75;
        else if (cn.split(/[\s-]+/).some(w => w.startsWith(query))) s = 55;
        else if (query.length > 2 && cn.includes(query)) s = 35;
        if (s > score) { score = s; via = cc; }
      }
      if (score) hits.push({ code: c, via, score });
    }
    return hits.sort((a, b) => b.score - a.score || nameOf(a.code).localeCompare(nameOf(b.code))).slice(0, 40);
  }

  function optHtml({ code, via }) {
    const title = via ? countryName(via) : nameOf(code);
    const sub = via ? nameOf(code) : (homeCountry(code) ? countryName(homeCountry(code)) : '');
    return `<button class="opt${code === local ? ' selected' : ''}" type="button" data-code="${code}" data-cc="${via || ''}">
      <span class="flag">${via ? flagOfCountry(via) : flagOf(code)}</span>
      <span><div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</span>
      <span class="c">${code}</span>
    </button>`;
  }

  let firstResult = null;
  function renderResults() {
    const out = $('results');
    if (!rates) { out.innerHTML = '<p class="empty">Rates are still loading…</p>'; return; }
    const hits = searchCurrencies($('search').value);
    if (hits) {
      firstResult = hits[0] || null;
      out.innerHTML = hits.length
        ? `<div class="group">${hits.map(optHtml).join('')}</div>`
        : `<p class="empty">No currency matches “${esc($('search').value)}”.<br>Try a country (Japan), a currency (yen) or a code (JPY).</p>`;
      return;
    }
    firstResult = null;
    const recent = readRecent().filter(c => rates[c]);
    const suggested = SUGGESTED.filter(c => rates[c] && !recent.includes(c));
    out.innerHTML =
      (recent.length ? `<div class="group-label">Recent</div><div class="group">${recent.map(code => optHtml({ code })).join('')}</div>` : '') +
      `<div class="group-label">Popular destinations</div><div class="group">${suggested.map(code => optHtml({ code })).join('')}</div>` +
      `<div class="group-label">Your currencies</div><div class="group">${FAVOURITES.map(code => optHtml({ code })).join('')}</div>`;
  }

  function openPicker() {
    $('search').value = '';
    renderResults();
    document.body.classList.add('picking');
    $('results').scrollTop = 0;
    setTimeout(() => $('search').focus(), 50);
  }
  function closePicker() {
    document.body.classList.remove('picking');
    $('search').blur();
  }

  // ---------- Events ----------
  document.addEventListener('input', (e) => {
    const input = e.target.closest('.amt-input');
    if (!input) return;
    const v = parse(input.value);
    anchor = { code: input.dataset.code, value: isFinite(v) ? v : 0 };
    store.set(STORE_AMOUNT, String(convert(anchor.value, anchor.code, local)));
    render();
  });
  document.addEventListener('focusin', (e) => {
    if (e.target.matches('.amt-input')) setTimeout(() => e.target.select(), 0);
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.matches('.amt-input')) render();
  });

  $('changeBtn').addEventListener('click', openPicker);
  $('doneBtn').addEventListener('click', closePicker);
  $('scrim').addEventListener('click', closePicker);
  $('search').addEventListener('input', renderResults);
  $('search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && firstResult) {
      heroDetected = false;
      setLocal(firstResult.code, firstResult.via);
      closePicker();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('picking')) closePicker();
  });
  $('results').addEventListener('click', (e) => {
    const b = e.target.closest('.opt');
    if (!b) return;
    heroDetected = false;
    setLocal(b.dataset.code, b.dataset.cc || null);
    closePicker();
  });

  $('refreshBtn').addEventListener('click', loadRates);
  $('locateBtn').addEventListener('click', () => detectLocation(true));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    loadRates();
    detectLocation(false);
  });

  // ---------- Location → local currency ----------
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(resolve, reject,
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 15 * 60 * 1000 });
    });
  }

  // GPS / network position, turned into a country code.
  async function countryFromGps() {
    const { latitude, longitude } = (await getPosition()).coords;
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
    const j = await r.json();
    if (!j.countryCode) throw new Error('no country');
    return j.countryCode.toUpperCase();
  }

  // IP-based fallback (no permission needed, but can be wrong when roaming on a home SIM).
  async function countryFromIp() {
    const r = await fetch('https://get.geojs.io/v1/ip/country.json');
    const j = await r.json();
    if (!j.country) throw new Error('no country');
    return j.country.toUpperCase();
  }

  let detecting = false;
  let lastDetect = 0;
  async function detectLocation(manual) {
    if (detecting) return;
    if (!manual && Date.now() - lastDetect < DETECT_EVERY_MS) return;
    detecting = true;
    lastDetect = Date.now();
    const btn = $('locateBtn');
    btn.disabled = true;
    btn.textContent = 'Locating…';
    let cc = null;
    try { cc = await countryFromGps(); }
    catch { try { cc = await countryFromIp(); } catch {} }
    btn.disabled = false;
    btn.textContent = 'Use my location';
    detecting = false;

    const cur = cc && COUNTRY_CURRENCY[cc];
    if (!cur) {
      if (manual) setStatus('err', 'Couldn’t find your location. Choose a currency instead.');
      return;
    }
    // Only switch when she has moved to a new country (or asked), so a manual pick sticks until the next trip.
    if (manual || cc !== store.get(STORE_COUNTRY)) {
      store.set(STORE_COUNTRY, cc);
      if (!rates || rates[cur]) {
        heroDetected = true;
        setLocal(cur, cc);
      }
    } else if (local === cur) {
      heroDetected = true;
      place = cc;
      render();
    }
  }

  // ---------- Start ----------
  const saved = readSaved();
  if (saved && saved.rates) {
    rates = saved.rates; updatedAt = new Date(saved.updatedAt);
    afterRates(false);
  } else {
    render();
  }
  loadRates();
  detectLocation(false);
  setInterval(loadRates, REFRESH_MS);
  setInterval(refreshStatus, 30 * 1000);
})();
</script>
</body>
</html>
