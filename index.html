<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crew FX">
<title>Crew FX</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #14202e;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #0f2a44;
    --accent-2: #c9a24a;
    --focus: #2563eb;
    --ok: #15803d;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1320;
      --card: #142033;
      --ink: #e8eef6;
      --muted: #94a3b8;
      --line: #22324a;
      --accent: #0a1a2c;
      --accent-2: #d8b25c;
      --focus: #60a5fa;
      --ok: #4ade80;
      --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 18px) 16px 22px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: .2px;
  }
  h1 span { color: var(--accent-2); }
  .status {
    margin-top: 6px;
    font-size: 13px;
    color: #b8c4d4;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex: none; }
  .dot.live { background: #4ade80; }
  .dot.stale { background: #fbbf24; }
  .dot.err { background: #f87171; }
  button.refresh {
    margin-left: auto;
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button.refresh:active { background: rgba(255,255,255,.1); }

  main { padding: 0 16px 32px; }
  .local {
    background: var(--card);
    border-radius: 16px;
    margin-top: -12px;
    padding: 14px 16px 16px;
    box-shadow: 0 6px 20px rgba(15, 42, 68, .12);
  }
  .local label.small {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
  }
  .rows { margin-top: 14px; display: grid; gap: 10px; }
  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: 12px;
  }
  .row.is-local { border-color: var(--accent-2); border-width: 2px; }
  .flag { font-size: 28px; line-height: 1; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .code { font-weight: 700; font-size: 15px; }
  .name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rate { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: 6px; }
  input.amt {
    grid-column: 1 / -1;
    margin-top: 6px;
    width: 100%;
    font: inherit;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 6px 10px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    text-align: right;
  }
  input.amt:focus { outline: none; border-color: var(--focus); }
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .label-row label.small { margin-bottom: 0; }
  button.locate {
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  button.locate:disabled { opacity: .6; }
  .detected { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .quick { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .quick button {
    flex: 1 1 auto;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  .quick button:active { border-color: var(--focus); }
  .note { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  .error { color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Crew <span>FX</span></h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Loading live rates…</span>
      <button class="refresh" id="refreshBtn" type="button">Refresh</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="local">
      <div class="label-row">
        <label class="small" for="localSel">I'm in (local currency)</label>
        <button class="locate" id="locateBtn" type="button">📍 Detect</button>
      </div>
      <select id="localSel"></select>
      <div class="detected" id="detected"></div>
      <div class="quick" id="quick"></div>
    </section>

    <div class="rows" id="rows"></div>

    <p class="note">
      Type in any box — the others convert instantly.<br>
      Mid-market rates, auto-refresh every 5 min. Last rates are saved for offline use in flight.
    </p>
  </div>
</main>

<script>
(() => {
  // Her most used currencies, always shown.
  const FAVOURITES = ['AED', 'KRW', 'CAD', 'USD'];
  const REFRESH_MS = 5 * 60 * 1000;
  const STORE_RATES = 'crewfx.rates';
  const STORE_LOCAL = 'crewfx.local';
  const STORE_AMOUNT = 'crewfx.amount';
  const STORE_COUNTRY = 'crewfx.country';
  const DETECT_EVERY_MS = 30 * 60 * 1000;

  // ISO country code → currency code.
  const COUNTRY_CURRENCY = Object.fromEntries(`
    AD:EUR AE:AED AF:AFN AG:XCD AI:XCD AL:ALL AM:AMD AO:AOA AR:ARS AS:USD AT:EUR AU:AUD AW:AWG AX:EUR AZ:AZN
    BA:BAM BB:BBD BD:BDT BE:EUR BF:XOF BG:BGN BH:BHD BI:BIF BJ:XOF BL:EUR BM:BMD BN:BND BO:BOB BQ:USD BR:BRL
    BS:BSD BT:BTN BW:BWP BY:BYN BZ:BZD CA:CAD CC:AUD CD:CDF CF:XAF CG:XAF CH:CHF CI:XOF CK:NZD CL:CLP CM:XAF
    CN:CNY CO:COP CR:CRC CU:CUP CV:CVE CW:ANG CX:AUD CY:EUR CZ:CZK DE:EUR DJ:DJF DK:DKK DM:XCD DO:DOP DZ:DZD
    EC:USD EE:EUR EG:EGP EH:MAD ER:ERN ES:EUR ET:ETB FI:EUR FJ:FJD FK:FKP FM:USD FO:DKK FR:EUR GA:XAF GB:GBP
    GD:XCD GE:GEL GF:EUR GG:GBP GH:GHS GI:GIP GL:DKK GM:GMD GN:GNF GP:EUR GQ:XAF GR:EUR GT:GTQ GU:USD GW:XOF
    GY:GYD HK:HKD HN:HNL HR:EUR HT:HTG HU:HUF ID:IDR IE:EUR IL:ILS IM:GBP IN:INR IO:USD IQ:IQD IR:IRR IS:ISK
    IT:EUR JE:GBP JM:JMD JO:JOD JP:JPY KE:KES KG:KGS KH:KHR KI:AUD KM:KMF KN:XCD KP:KPW KR:KRW KW:KWD KY:KYD
    KZ:KZT LA:LAK LB:LBP LC:XCD LI:CHF LK:LKR LR:LRD LS:LSL LT:EUR LU:EUR LV:EUR LY:LYD MA:MAD MC:EUR MD:MDL
    ME:EUR MF:EUR MG:MGA MH:USD MK:MKD ML:XOF MM:MMK MN:MNT MO:MOP MP:USD MQ:EUR MR:MRU MS:XCD MT:EUR MU:MUR
    MV:MVR MW:MWK MX:MXN MY:MYR MZ:MZN NA:NAD NC:XPF NE:XOF NF:AUD NG:NGN NI:NIO NL:EUR NO:NOK NP:NPR NR:AUD
    NU:NZD NZ:NZD OM:OMR PA:PAB PE:PEN PF:XPF PG:PGK PH:PHP PK:PKR PL:PLN PM:EUR PN:NZD PR:USD PS:ILS PT:EUR
    PW:USD PY:PYG QA:QAR RE:EUR RO:RON RS:RSD RU:RUB RW:RWF SA:SAR SB:SBD SC:SCR SD:SDG SE:SEK SG:SGD SH:SHP
    SI:EUR SK:EUR SL:SLE SM:EUR SN:XOF SO:SOS SR:SRD SS:SSP ST:STN SV:USD SX:ANG SY:SYP SZ:SZL TC:USD TD:XAF
    TG:XOF TH:THB TJ:TJS TK:NZD TL:USD TM:TMT TN:TND TO:TOP TR:TRY TT:TTD TV:AUD TW:TWD TZ:TZS UA:UAH UG:UGX
    UM:USD US:USD UY:UYU UZ:UZS VA:EUR VC:XCD VE:VES VG:USD VI:USD VN:VND VU:VUV WF:XPF WS:WST XK:EUR YE:YER
    YT:EUR ZA:ZAR ZM:ZMW ZW:ZWL
  `.trim().split(/\s+/).map(p => p.split(':')));

  // Common crew destinations shown as one-tap chips (plus the last used).
  const QUICK = ['THB', 'EUR', 'GBP', 'JPY', 'INR', 'SGD'];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let rates = null;        // units of currency per 1 USD
  let updatedAt = null;    // Date of source update
  let source = '';
  let local = store.get(STORE_LOCAL) || 'THB';
  // The "anchor" is the value the user last typed; everything else is derived from it.
  let anchor = { code: local, value: parseFloat(store.get(STORE_AMOUNT)) || 100 };

  const names = (() => {
    try { return new Intl.DisplayNames(['en'], { type: 'currency' }); } catch { return null; }
  })();
  const nameOf = (c) => (names && names.of(c)) || c;

  // Currency code → flag emoji (first two letters are usually the ISO country).
  const FLAG_OVERRIDE = { EUR: '🇪🇺', XAF: '🌍', XOF: '🌍', XCD: '🌎', XPF: '🌏', ANG: '🇨🇼', XDR: '🌐' };
  const flagOf = (c) => FLAG_OVERRIDE[c] ||
    String.fromCodePoint(...[...c.slice(0, 2)].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));

  const decimalsOf = (c) => {
    try {
      return new Intl.NumberFormat('en', { style: 'currency', currency: c }).resolvedOptions().maximumFractionDigits;
    } catch { return 2; }
  };
  const fmt = (n, c) => {
    if (!isFinite(n)) return '';
    const d = decimalsOf(c);
    return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  const parse = (s) => parseFloat(String(s).replace(/[^0-9.\-]/g, ''));

  const convert = (value, from, to) => value / rates[from] * rates[to];

  // ---------- Rate fetching (two free, key-less sources) ----------
  async function fetchPrimary() {
    const r = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
    const j = await r.json();
    if (j.result !== 'success') throw new Error('bad response');
    return { rates: j.rates, updatedAt: new Date(j.time_last_update_unix * 1000), source: 'open.er-api.com' };
  }
  async function fetchFallback() {
    const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json', { cache: 'no-store' });
    const j = await r.json();
    const out = {};
    for (const [k, v] of Object.entries(j.usd)) {
      if (/^[a-z]{3}$/.test(k) && typeof v === 'number') out[k.toUpperCase()] = v;
    }
    out.USD = 1;
    return { rates: out, updatedAt: new Date(j.date + 'T00:00:00Z'), source: 'currency-api' };
  }

  async function loadRates() {
    setStatus('', 'Updating rates…');
    for (const fn of [fetchPrimary, fetchFallback]) {
      try {
        const res = await fn();
        rates = res.rates; updatedAt = res.updatedAt; source = res.source;
        store.set(STORE_RATES, JSON.stringify({ rates, updatedAt: updatedAt.toISOString(), source, fetchedAt: Date.now() }));
        afterRates(true);
        return;
      } catch (e) { /* try next source */ }
    }
    // Both failed — use saved rates if we have them (e.g. no wifi on board).
    const saved = readSaved();
    if (saved) {
      rates = saved.rates; updatedAt = new Date(saved.updatedAt); source = saved.source;
      afterRates(false);
    } else {
      setStatus('err', 'Could not load rates. Check your connection.');
    }
  }

  function readSaved() {
    try { return JSON.parse(store.get(STORE_RATES)); } catch { return null; }
  }

  function timeAgo(d) {
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 90) return 'just now';
    const m = Math.round(s / 60);
    if (m < 90) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 36) return `${h} h ago`;
    return `${Math.round(h / 24)} days ago`;
  }

  function setStatus(kind, text) {
    $('dot').className = 'dot' + (kind ? ' ' + kind : '');
    $('statusText').textContent = text;
  }

  let lastLive = false;
  function refreshStatus() {
    if (!updatedAt) return;
    const when = updatedAt.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    if (lastLive) setStatus('live', `Live · rates from ${when} (${timeAgo(updatedAt)})`);
    else setStatus('stale', `Offline · using saved rates from ${when}`);
  }

  function afterRates(live) {
    lastLive = live;
    refreshStatus();
    buildSelect();
    render();
  }

  // ---------- UI ----------
  function buildSelect() {
    const sel = $('localSel');
    const codes = Object.keys(rates).filter(c => /^[A-Z]{3}$/.test(c))
      .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    if (!rates[local]) local = 'USD';
    sel.innerHTML = codes.map(c =>
      `<option value="${c}"${c === local ? ' selected' : ''}>${flagOf(c)}  ${c} — ${nameOf(c)}</option>`).join('');
    buildQuick();
  }

  function buildQuick() {
    const chips = [...new Set([local, ...QUICK])].filter(c => rates[c] && !FAVOURITES.includes(c)).slice(0, 6);
    $('quick').innerHTML = chips.map(c =>
      `<button type="button" data-code="${c}">${flagOf(c)} ${c}</button>`).join('');
  }

  function setLocal(code) {
    // Keep the displayed local amount meaningful when switching country.
    const baseValue = rates ? convert(anchor.value, anchor.code, 'USD') : anchor.value;
    local = code;
    store.set(STORE_LOCAL, code);
    if (rates && !FAVOURITES.includes(anchor.code)) {
      anchor = { code, value: Math.round(convert(baseValue, 'USD', code)) || 100 };
    }
    if (!rates) { anchor = { code, value: anchor.value }; return; }
    $('localSel').value = code;
    buildQuick();
    render();
  }

  function rowCodes() {
    return [local, ...FAVOURITES.filter(c => c !== local)];
  }

  function render() {
    if (!rates) return;
    const codes = rowCodes();
    const rowsEl = $('rows');
    // Rebuild rows only if the set of currencies changed (keeps focus while typing).
    if (rowsEl.dataset.codes !== codes.join(',')) {
      rowsEl.dataset.codes = codes.join(',');
      rowsEl.innerHTML = codes.map(c => `
        <div class="row${c === local ? ' is-local' : ''}">
          <div class="flag">${flagOf(c)}</div>
          <div class="meta">
            <span class="code">${c}${c === local ? ' · local' : ''}</span>
            <span class="name">${nameOf(c)}</span>
          </div>
          <input class="amt" data-code="${c}" inputmode="decimal" autocomplete="off" aria-label="${nameOf(c)} amount">
          <div class="rate" data-rate="${c}"></div>
        </div>`).join('');
    }
    if (!rates[anchor.code]) anchor = { code: local, value: anchor.value };
    for (const input of rowsEl.querySelectorAll('input.amt')) {
      const c = input.dataset.code;
      if (document.activeElement === input && c === anchor.code) continue; // don't reformat what she's typing
      input.value = fmt(convert(anchor.value, anchor.code, c), c);
    }
    for (const el of rowsEl.querySelectorAll('[data-rate]')) {
      const c = el.dataset.rate;
      if (c === local) {
        const ref = FAVOURITES.find(f => f !== local) || 'USD';
        el.textContent = `1 ${c} = ${fmtRate(convert(1, c, ref))} ${ref}`;
      } else {
        el.textContent = `1 ${c} = ${fmtRate(convert(1, c, local))} ${local}  ·  1 ${local} = ${fmtRate(convert(1, local, c))} ${c}`;
      }
    }
  }

  function fmtRate(n) {
    if (n >= 100) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return n.toLocaleString('en-US', { maximumSignificantDigits: 4 });
  }

  // ---------- Events ----------
  $('rows').addEventListener('input', (e) => {
    const input = e.target.closest('input.amt');
    if (!input) return;
    const v = parse(input.value);
    anchor = { code: input.dataset.code, value: isFinite(v) ? v : 0 };
    store.set(STORE_AMOUNT, String(convert(anchor.value, anchor.code, local)));
    render();
  });
  $('rows').addEventListener('focusin', (e) => {
    if (e.target.matches('input.amt')) setTimeout(() => e.target.select(), 0);
  });
  $('rows').addEventListener('focusout', (e) => {
    if (e.target.matches('input.amt')) render();
  });
  $('localSel').addEventListener('change', (e) => setLocal(e.target.value));
  $('quick').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-code]');
    if (b) setLocal(b.dataset.code);
  });
  $('refreshBtn').addEventListener('click', loadRates);
  $('locateBtn').addEventListener('click', () => detectLocation(true));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    loadRates();
    detectLocation(false);
  });

  // ---------- Location → local currency ----------
  const regionNames = (() => {
    try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; }
  })();
  const countryName = (cc) => (regionNames && regionNames.of(cc)) || cc;

  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(resolve, reject,
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 15 * 60 * 1000 });
    });
  }

  // GPS / network position, turned into a country code.
  async function countryFromGps() {
    const pos = await getPosition();
    const { latitude, longitude } = pos.coords;
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
    const j = await r.json();
    if (!j.countryCode) throw new Error('no country');
    return j.countryCode.toUpperCase();
  }

  // IP-based fallback (no permission needed, but can be wrong when roaming on a home SIM).
  async function countryFromIp() {
    const r = await fetch('https://get.geojs.io/v1/ip/country.json');
    const j = await r.json();
    if (!j.country) throw new Error('no country');
    return j.country.toUpperCase();
  }

  let detecting = false;
  let lastDetect = 0;
  async function detectLocation(manual) {
    if (detecting) return;
    if (!manual && Date.now() - lastDetect < DETECT_EVERY_MS) return;
    detecting = true;
    lastDetect = Date.now();
    const btn = $('locateBtn');
    btn.disabled = true;
    btn.textContent = '📍 Locating…';
    let cc = null, how = '';
    try { cc = await countryFromGps(); how = 'GPS'; }
    catch {
      try { cc = await countryFromIp(); how = 'network'; } catch {}
    }
    btn.disabled = false;
    btn.textContent = '📍 Detect';
    detecting = false;

    const cur = cc && COUNTRY_CURRENCY[cc];
    if (!cur) {
      if (manual) $('detected').textContent = 'Could not detect location — pick the currency above.';
      return;
    }
    $('detected').textContent = `📍 Detected ${countryName(cc)} (${how})`;
    // Only switch when she has moved to a new country (or asked), so a manual pick sticks until the next trip.
    if (manual || cc !== store.get(STORE_COUNTRY)) {
      store.set(STORE_COUNTRY, cc);
      if (!rates || rates[cur]) setLocal(cur);
    }
  }

  // ---------- Start ----------
  const saved = readSaved();
  if (saved && saved.rates) {
    rates = saved.rates; updatedAt = new Date(saved.updatedAt); source = saved.source;
    afterRates(false);
  }
  loadRates();
  detectLocation(false);
  setInterval(loadRates, REFRESH_MS);
  setInterval(refreshStatus, 30 * 1000);
})();
</script>
</body>
</html>
